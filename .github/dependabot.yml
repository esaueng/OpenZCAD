version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # typescript-eslint cannot load under TypeScript 7 at all; see
    # typescript-eslint/typescript-eslint#10940.
    ignore:
      - dependency-name: typescript
        versions:
          - '>= 7.0.0'
      # remus-wasm tracks a GitHub branch, so any lockfile regeneration
      # re-resolves it to main and trips the kernel-pin guard in ci.yml.
      # Kernel moves land through update-remus.yml instead.
      - dependency-name: remus-wasm
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
