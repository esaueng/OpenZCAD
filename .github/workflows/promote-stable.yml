name: Promote stable

# Moving the `stable` branch is the production release: Workers Builds
# deploys openzcad-stable from it. A ruleset lets only deploy keys update
# `stable`, and the one deploy key lives in the `stable-promotion`
# environment, which takes runs from main only and waits for the owner's
# approval. So every release is this workflow, on record, approved, and a
# fast-forward to a commit already on main. docs/release-channels.md.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit on main to promote (full or short SHA)
        required: true
        type: string
      dry_run:
        description: List the commits and D1 migrations without pushing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: stable-promotion
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != refs/heads/main ]]; then
            echo "::error::Run Promote stable from main, not $REF."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.STABLE_PROMOTION_DEPLOY_KEY }}
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Promote
        env:
          COMMIT: ${{ inputs.commit }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=("$COMMIT")
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          node scripts/promote-stable.mjs "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
