name: Promote stable

# Moving the `stable` branch is the production release: Workers Builds
# deploys openzcad-stable from it. A ruleset lets only deploy keys update
# `stable`, and the one deploy key lives in the `stable-promotion`
# environment, which takes runs from main only. So every release is this
# workflow, on record, and a fast-forward to a commit already on main:
# once a day to the latest main, or by hand to any commit on main.
# docs/release-channels.md.

on:
  schedule:
    # Daily at 10:00 UTC (GitHub may start scheduled runs a little late).
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      commit:
        description: Commit on main to promote (full or short SHA); empty for the latest main
        required: false
        type: string
        default: ''
      dry_run:
        description: List the commits and D1 migrations without pushing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: stable-promotion
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != refs/heads/main ]]; then
            echo "::error::Run Promote stable from main, not $REF."
            exit 1
          fi
      # The workflow code of the commit the run started at, not whatever main
      # has become while it queued. The script still fetches current main to
      # check the target is on it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.STABLE_PROMOTION_DEPLOY_KEY }}
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Promote
        env:
          COMMIT: ${{ inputs.commit }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ -z "$COMMIT" ]]; then
            # Scheduled runs (and a dispatch without a commit) take the
            # latest main at the time of promotion.
            git fetch --quiet origin main
            COMMIT=$(git rev-parse --verify refs/remotes/origin/main^{commit})
          fi
          args=("$COMMIT")
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          node scripts/promote-stable.mjs "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
