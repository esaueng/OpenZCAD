name: ci

on:
  pull_request:
    # `labeled`/`unlabeled` re-run the kernel-bump guard below when the
    # `kernel-bump` label is applied or removed, without needing a push.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  # Non-PR runs must not replace a pending merge-group verdict.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    permissions:
      contents: read
    uses: esaueng/OpenZCAD/.github/workflows/fleet-ci.yml@d35b2ff9098cb065b096f300910db753b3b0ad0c
