name: ci

on:
  pull_request:
    # `labeled`/`unlabeled` re-run the kernel-bump guard below when the
    # `kernel-bump` label is applied or removed, without needing a push.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    permissions:
      contents: read
    uses: esaueng/OpenZCAD/.github/workflows/fleet-ci.yml@b5a46db67b4472d831de3bb4c7536eea0c659275
