name: ci

on:
  pull_request:
    # Label events re-run the kernel-bump guard without needing a push.
    # Keep the reusable caller running: skipping it replaces the latest
    # check suite without publishing its required validate/e2e contexts.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  # Non-PR runs must not replace a pending merge-group verdict.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    permissions:
      contents: read
    uses: esaueng/OpenZCAD/.github/workflows/fleet-ci.yml@f593505b95dfe7f2d8efd67021d703d02b52c2c9
