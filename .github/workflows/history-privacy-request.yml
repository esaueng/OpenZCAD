name: History privacy request

on:
  # Pull-request heads are audited once, by History privacy's own
  # pull_request_target run. Requesting a second audit for every branch push
  # repeated it on the same commit, so only main, tags and queue candidates
  # ask here. A branch with no pull request is covered when one opens and by
  # the daily all-refs audit.
  push:
    branches: [main]
    tags: ["**"]
  merge_group:

permissions:
  contents: read

jobs:
  history-privacy-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/privacy/
            /.github/workflows/commit-privacy.yml
            /.github/workflows/history-privacy*.yml
      - name: Synthetic privacy regression tests and audit request (no secrets)
        run: python3 -m unittest discover -s .github/privacy -p 'test_*.py'
