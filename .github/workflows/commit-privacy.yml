name: Commit privacy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ["**"]
    tags: ["**"]
  merge_group:

permissions:
  contents: read

jobs:
  commit-privacy:
    name: commit-privacy-readonly
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/privacy
      # This branch-controlled convenience check has no publishing permission.
      # The required App-bound verdict comes from the protected History workflow.
      - name: Check new commit identities without publishing a merge verdict
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: python3 .github/privacy/commit_privacy.py
