name: Dependency audit
on:
  # New advisories arrive through the daily schedule; pull requests run the
  # audit only when they change a dependency manifest or lockfile.
  pull_request:
    paths:
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - '**/package.json'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/rust-toolchain*'
      - .cargo/**
      - apps/desktop/src-tauri/**
      - apps/desktop/glib-regression/**
      - apps/desktop/device-keys/**
      - .github/workflows/dependency-audit.yml
      - scripts/dependency-audit-selection.*
      - scripts/install-cargo-audit.sh
      - test/ci-runtime-optimization.test.ts
  push:
    branches: [main]
    paths:
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - '**/package.json'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/rust-toolchain*'
      - .cargo/**
      - apps/desktop/src-tauri/**
      - apps/desktop/glib-regression/**
      - apps/desktop/device-keys/**
      - .github/workflows/dependency-audit.yml
      - scripts/dependency-audit-selection.*
      - scripts/install-cargo-audit.sh
      - test/ci-runtime-optimization.test.ts
  schedule:
    - cron: '41 8 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      javascript: ${{ steps.select.outputs.javascript }}
      rust: ${{ steps.select.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - id: select
        run: node scripts/dependency-audit-selection.mjs
  javascript:
    needs: plan
    if: needs.plan.outputs.javascript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm audit --audit-level=high
  rust:
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the checksum-pinned cargo-audit release
        run: bash scripts/install-cargo-audit.sh
      - run: cargo audit --file apps/desktop/src-tauri/Cargo.lock
      - run: cargo audit --file apps/desktop/device-keys/Cargo.lock
      - name: Verify desktop GLib backport resolution
        run: |
          cargo metadata --locked --format-version 1 --manifest-path apps/desktop/src-tauri/Cargo.toml |
            jq -e '[.packages[] | select(.name == "glib" and .version == "0.18.5")] |
              length == 1 and (.[0].source == null) and
              (.[0].manifest_path | endswith("/src-tauri/vendor/glib/Cargo.toml"))'
      - name: Install GLib regression test prerequisites
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev pkg-config
      - name: Run optimized GLib iterator regression
        run: cargo test --release --locked --manifest-path apps/desktop/glib-regression/Cargo.toml
      - name: Test the desktop device-key crate
        run: |
          cargo fmt --check --manifest-path apps/desktop/device-keys/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path apps/desktop/device-keys/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path apps/desktop/device-keys/Cargo.toml
