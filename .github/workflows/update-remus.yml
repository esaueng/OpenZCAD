name: Update Remus

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: update-remus
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for an existing Remus update PR
        id: existing-pr
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_url="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base "$BASE_BRANCH" \
              --json headRefName,url \
              --jq '[.[] | select(.headRefName | startswith("automation/remus-"))][0].url // empty'
          )"

          if [[ -n "$existing_url" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "An update PR is already open: $existing_url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the default branch
        if: steps.existing-pr.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up pnpm
        if: steps.existing-pr.outputs.skip != 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.8.0

      - name: Set up Node.js
        if: steps.existing-pr.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve the newest Remus commit
        if: steps.existing-pr.outputs.skip != 'true'
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extract_remus_sha() {
            node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const lockfile = readFileSync('pnpm-lock.yaml', 'utf8');
          const pattern = /https:\/\/codeload\.github\.com\/esaueng\/remus\/tar\.gz\/([0-9a-f]{40})#path:\/crates\/wasm\/pkg/g;
          const shas = [...new Set([...lockfile.matchAll(pattern)].map((match) => match[1]))];

          if (shas.length !== 1) {
            console.error(`Expected one immutable Remus SHA in pnpm-lock.yaml, found ${shas.length}.`);
            process.exit(1);
          }

          process.stdout.write(shas[0]);
          NODE
          }

          old_sha="$(extract_remus_sha)"

          pnpm update remus-wasm --filter @openzcad/kernel-adapter --lockfile-only

          new_sha="$(extract_remus_sha)"
          upstream_sha="$(gh api repos/esaueng/remus/commits/main --jq .sha)"

          if [[ "$new_sha" != "$upstream_sha" ]]; then
            echo "::error title=Stale Remus resolution::pnpm resolved $new_sha but esaueng/remus main is $upstream_sha. Refusing to open a PR."
            exit 1
          fi

          if git diff --quiet --exit-code; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Remus is already current at $new_sha; no branch or PR was created." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          unexpected_paths="$(git diff --name-only | grep -v '^pnpm-lock.yaml$' || true)"
          if [[ -n "$unexpected_paths" ]]; then
            echo "::error title=Unexpected updater diff::The targeted update changed files other than pnpm-lock.yaml: $unexpected_paths"
            exit 1
          fi

          if [[ "$old_sha" == "$new_sha" ]]; then
            echo "::error title=Unexpected lockfile diff::pnpm-lock.yaml changed without advancing the Remus SHA."
            exit 1
          fi

          package_version="$(
            gh api "repos/esaueng/remus/contents/crates/wasm/pkg/package.json?ref=$new_sha" --jq .content \
              | base64 --decode \
              | node --input-type=module -e '
                  import { readFileSync } from "node:fs";
                  const value = JSON.parse(readFileSync(0, "utf8")).version;
                  if (typeof value !== "string" || !/^[0-9A-Za-z][0-9A-Za-z.+-]*$/.test(value)) process.exit(1);
                  process.stdout.write(value);
                '
          )"

          old_wasm="$RUNNER_TEMP/remus-wasm-$old_sha.wasm"
          new_wasm="$RUNNER_TEMP/remus-wasm-$new_sha.wasm"
          download_wasm() {
            local ref="$1"
            local output="$2"
            local blob_sha
            blob_sha="$(
              gh api \
                "repos/esaueng/remus/contents/crates/wasm/pkg/remus_wasm_bg.wasm?ref=$ref" \
                --jq .sha
            )"
            gh api "repos/esaueng/remus/git/blobs/$blob_sha" --jq .content \
              | base64 --decode > "$output"
          }
          download_wasm "$old_sha" "$old_wasm"
          download_wasm "$new_sha" "$new_wasm"

          OLD_WASM="$old_wasm" NEW_WASM="$new_wasm" node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          import {
            evaluateKernelPinGrowth,
            evaluateKernelWasm,
            measureKernelWasm
          } from './scripts/bundle-size-policy.mjs';

          const before = measureKernelWasm(readFileSync(process.env.OLD_WASM));
          const after = measureKernelWasm(readFileSync(process.env.NEW_WASM));
          const growth = evaluateKernelPinGrowth(before, after);
          const policy = evaluateKernelWasm(after);
          const reviewReasons = [
            ...growth.triggers,
            ...policy.warnings.map(({ reason }) => reason)
          ];
          const rawDeltaPercent =
            growth.rawDeltaRatio === null ? 0 : growth.rawDeltaRatio * 100;

          const outputs = {
            old_raw_bytes: before.rawBytes,
            new_raw_bytes: after.rawBytes,
            raw_delta_bytes: growth.rawDeltaBytes,
            raw_delta_percent: rawDeltaPercent.toFixed(2),
            old_gzip_bytes: before.gzipBytes,
            new_gzip_bytes: after.gzipBytes,
            gzip_delta_bytes: growth.gzipDeltaBytes,
            old_brotli_bytes: before.brotliBytes,
            new_brotli_bytes: after.brotliBytes,
            brotli_delta_bytes: growth.brotliDeltaBytes,
            size_review_required: reviewReasons.length > 0,
            size_review_reasons: reviewReasons.join('; ') || 'none',
            size_budget_failure: policy.failures.length > 0,
            size_budget_failures:
              policy.failures.map(({ reason }) => reason).join('; ') || 'none'
          };

          for (const [key, value] of Object.entries(outputs)) {
            console.log(`${key}=${value}`);
          }
          NODE

          {
            echo "changed=true"
            echo "old_sha=$old_sha"
            echo "new_sha=$new_sha"
            echo "short_sha=${new_sha:0:7}"
            echo "package_version=$package_version"
          } >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN-authored pull requests do not trigger ordinary
      # pull_request workflows. Fail closed on an actual update until a
      # repository-scoped GitHub App identity is configured for normal CI.
      - name: Require CI-triggering GitHub App credentials
        if: steps.existing-pr.outputs.skip != 'true' && steps.update.outputs.changed == 'true'
        env:
          APP_CLIENT_ID: ${{ vars.REMUS_UPDATER_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.REMUS_UPDATER_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error title=GitHub App required::Configure REMUS_UPDATER_APP_CLIENT_ID and REMUS_UPDATER_APP_PRIVATE_KEY for a repository-installed app with Contents and Pull requests write permission. The default GITHUB_TOKEN is intentionally not used to open a CI-suppressed PR."
            exit 1
          fi

      - name: Create GitHub App token
        if: steps.existing-pr.outputs.skip != 'true' && steps.update.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REMUS_UPDATER_APP_CLIENT_ID }}
          private-key: ${{ secrets.REMUS_UPDATER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Commit and push the update branch
        if: steps.existing-pr.outputs.skip != 'true' && steps.update.outputs.changed == 'true'
        id: publish
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_SHA: ${{ steps.update.outputs.new_sha }}
          SHORT_SHA: ${{ steps.update.outputs.short_sha }}
        run: |
          branch="automation/remus-$SHORT_SHA"
          bot_login="${APP_SLUG}[bot]"
          bot_id="$(gh api "users/$bot_login" --jq .id)"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::error title=Update branch already exists::$branch already exists on origin; refusing to overwrite it."
            exit 1
          fi

          gh auth setup-git
          git config user.name "$bot_login"
          git config user.email "$bot_id+$bot_login@users.noreply.github.com"
          git switch -c "$branch"
          git add -- pnpm-lock.yaml

          if [[ "$(git diff --cached --name-only)" != 'pnpm-lock.yaml' ]]; then
            echo "::error title=Unexpected staged files::Only pnpm-lock.yaml may be committed by this workflow."
            exit 1
          fi

          git commit -m "chore(deps): update Remus to $SHORT_SHA"
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        if: steps.existing-pr.outputs.skip != 'true' && steps.update.outputs.changed == 'true'
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ steps.publish.outputs.branch }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OLD_SHA: ${{ steps.update.outputs.old_sha }}
          NEW_SHA: ${{ steps.update.outputs.new_sha }}
          SHORT_SHA: ${{ steps.update.outputs.short_sha }}
          PACKAGE_VERSION: ${{ steps.update.outputs.package_version }}
          OLD_RAW_BYTES: ${{ steps.update.outputs.old_raw_bytes }}
          NEW_RAW_BYTES: ${{ steps.update.outputs.new_raw_bytes }}
          RAW_DELTA_BYTES: ${{ steps.update.outputs.raw_delta_bytes }}
          RAW_DELTA_PERCENT: ${{ steps.update.outputs.raw_delta_percent }}
          OLD_GZIP_BYTES: ${{ steps.update.outputs.old_gzip_bytes }}
          NEW_GZIP_BYTES: ${{ steps.update.outputs.new_gzip_bytes }}
          GZIP_DELTA_BYTES: ${{ steps.update.outputs.gzip_delta_bytes }}
          OLD_BROTLI_BYTES: ${{ steps.update.outputs.old_brotli_bytes }}
          NEW_BROTLI_BYTES: ${{ steps.update.outputs.new_brotli_bytes }}
          BROTLI_DELTA_BYTES: ${{ steps.update.outputs.brotli_delta_bytes }}
          SIZE_REVIEW_REQUIRED: ${{ steps.update.outputs.size_review_required }}
          SIZE_REVIEW_REASONS: ${{ steps.update.outputs.size_review_reasons }}
          SIZE_BUDGET_FAILURE: ${{ steps.update.outputs.size_budget_failure }}
          SIZE_BUDGET_FAILURES: ${{ steps.update.outputs.size_budget_failures }}
        run: |
          body_file="$RUNNER_TEMP/remus-update-pr.md"
          compare_url="https://github.com/esaueng/remus/compare/$OLD_SHA...$NEW_SHA"

          {
            echo '## Summary'
            echo
            echo "- update \`remus-wasm\` from \`$OLD_SHA\` to \`$NEW_SHA\`"
            echo "- package version: \`$PACKAGE_VERSION\`"
            echo "- compare: $compare_url"
            echo
            echo '## Kernel WASM size'
            echo
            echo '| Metric | Before | After | Delta |'
            echo '| --- | ---: | ---: | ---: |'
            echo "| Raw | $OLD_RAW_BYTES B | $NEW_RAW_BYTES B | $RAW_DELTA_BYTES B ($RAW_DELTA_PERCENT%) |"
            echo "| Node gzip | $OLD_GZIP_BYTES B | $NEW_GZIP_BYTES B | $GZIP_DELTA_BYTES B |"
            echo "| Brotli q11 | $OLD_BROTLI_BYTES B | $NEW_BROTLI_BYTES B | $BROTLI_DELTA_BYTES B |"
            echo
            if [[ "$SIZE_REVIEW_REQUIRED" == 'true' ]]; then
              echo "> **Kernel-size review required:** $SIZE_REVIEW_REASONS."
              echo
            fi
            if [[ "$SIZE_BUDGET_FAILURE" == 'true' ]]; then
              echo "> **The package exceeds a hard budget:** $SIZE_BUDGET_FAILURES. CI must remain red; do not raise the budget in this routine pin PR."
              echo
            fi
            echo '## Reproducibility'
            echo
            echo 'The manifest tracks `main` only as the updater input. The committed `pnpm-lock.yaml` resolves it to the immutable new commit above, and normal installs continue to use `pnpm install --frozen-lockfile`.'
            echo
            echo '## Automation and verification'
            echo
            echo '- Detected by the manual Remus updater using only the targeted lockfile-only pnpm update.'
            echo '- Duplicate update PRs are prevented by the workflow concurrency group and the open `automation/remus-*` PR check.'
            echo '- This GitHub App-authored PR triggers the repository pull-request CI, including lint, typecheck, web tests, parity corpus, build, and Playwright.'
            echo '- No deployment, publication, merge, or auto-merge was performed.'
          } > "$body_file"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "chore(deps): update Remus to $SHORT_SHA" \
            --body-file "$body_file"
