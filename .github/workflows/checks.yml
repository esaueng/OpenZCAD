# The jobs behind the required `checks / validate` and `checks / e2e`
# contexts. `ci.yml` calls this file from the same commit, so a pull request
# that edits it is checked by its own edit. Every job runs on a GitHub-hosted
# runner.
name: CI checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  plan:
    # Kernel declaration and the browser-suite choice for queue and manual
    # runs. It runs beside the checks, not ahead of them: a job that waited on
    # it paid for a second hosted-runner wait before starting. `validate` and
    # `e2e` still require it, and each job selects its own suites below.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      base: ${{ steps.select.outputs.base }}
      unit: ${{ steps.select.outputs.unit }}
      e2e: ${{ steps.select.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      # Keep the declaration inside required validate until the standalone
      # context is required and independently verified on PR/queue heads.
      - name: Refuse an unannounced geometry kernel bump
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: node scripts/kernel-pin-declaration.mjs
      - id: select
        run: node scripts/ci-selection.mjs

  quality:
    runs-on: ubuntu-24.04
    # Hosted jobs have hung for 4-14 minutes in "Cleaning up orphan processes"
    # after every step passed; the timeout counts that tail and turns a green
    # job into a cancelled required check, so each limit keeps that headroom.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Type-aware ESLint is one process that peaks near 6 GB, and each extra
      # thread builds its own program, so it is split across runners rather
      # than threads. The two partitions lint in about the same time and
      # together cover exactly the paths of `pnpm lint`
      # (`test/ci-runtime-optimization.test.ts`).
      matrix:
        paths: ['apps', 'packages test types']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm audit` lives in dependency-audit.yml: a newly published advisory
      # must not turn every PR and queue candidate red in this required gate.
      - run: pnpm lint:paths ${{ matrix.paths }}
  typecheck:
    runs-on: ubuntu-24.04
    # Hosted jobs have hung for 4-14 minutes in "Cleaning up orphan processes"
    # after every step passed; the timeout counts that tail and turns a green
    # job into a cancelled required check, so each limit keeps that headroom.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm audit` lives in dependency-audit.yml: a newly published advisory
      # must not turn every PR and queue candidate red in this required gate.
      - run: pnpm typecheck
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same selection `plan` reports, computed on this runner so the job
      # does not wait for another one.
      - name: Select affected suites
        id: select
        run: node scripts/ci-selection.mjs
      # `pnpm test` runs the root and web Vitest projects back to back; the
      # root project is the five-minute half and runs in the `unit` job, so
      # only the web happy-dom project runs here.
      - name: Run selected web units
        env:
          OPENZCAD_UNIT_SUITE: ${{ steps.select.outputs.unit }}
          CI_BASE_SHA: ${{ steps.select.outputs.base }}
          CI_UNIT_REPORT: ${{ runner.temp }}/unit-validation.json
        run: node scripts/run-ci-units.mjs web
      - name: Upload web unit selection and timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unit-web-report
          path: ${{ runner.temp }}/unit-validation.json*
          if-no-files-found: warn
          retention-days: ${{ job.status == 'success' && 7 || 14 }}
      # Keep exact Remus/OpenCascade STEP parity in the critical beta gate.
      - run: pnpm test:parity-corpus
      - name: Build and enforce bundle budgets
        env:
          OPENZCAD_BUNDLE_GITHUB_SUMMARY: '1'
          OPENZCAD_BUNDLE_REPORT_PATH: ${{ runner.temp }}/bundle-size-report.json
        run: pnpm build
      - name: Upload bundle size report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-size-report
          path: ${{ runner.temp }}/bundle-size-report.json
          if-no-files-found: warn
          retention-days: ${{ job.status == 'success' && 7 || 14 }}

  # The root Vitest project (packages and `test/`): the other half of
  # `pnpm test`, on its own runner so it runs beside the web project, parity
  # and build instead of ahead of them.
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same selection `plan` reports, computed on this runner so the job
      # does not wait for another one.
      - name: Select affected suites
        id: select
        run: node scripts/ci-selection.mjs
      - name: Run selected root partition
        env:
          OPENZCAD_UNIT_SUITE: ${{ steps.select.outputs.unit }}
          CI_BASE_SHA: ${{ steps.select.outputs.base }}
          CI_UNIT_REPORT: ${{ runner.temp }}/unit-unit.json
        run: node scripts/run-ci-units.mjs root --shard=${{ matrix.shard }}/2
      - name: Upload root unit selection and timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unit-root-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/unit-unit.json*
          if-no-files-found: warn
          retention-days: ${{ job.status == 'success' && 7 || 14 }}

  # The required check fails closed: it runs after any outcome and passes
  # only when every job it names succeeded.
  validate:
    needs: [plan, quality, typecheck, unit, validation]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require all validation checks
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$PLAN_RESULT" = success
          test "$TYPECHECK_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$VALIDATION_RESULT" = success
  # Manual qualifications and browser regression deletions run the full shard set.
  e2e-tests:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && github.event_name != 'pull_request' && (github.event_name != 'merge_group' || needs.plan.outputs.e2e == 'full') }}
    runs-on: ubuntu-24.04
    # Hosted shards ran 14-21 minutes on 19 Oct, against the ~7 the weights
    # below were balanced for; rebalance with `scripts/e2e-shards.mjs --update`.
    timeout-minutes: 45
    strategy: &e2e-strategy
      fail-fast: false
      # The suite is ~80 runner-minutes of browser work at Playwright's two
      # workers per hosted runner, so it runs as parallel shards. Each shard
      # takes the spec files `scripts/e2e-shards.mjs` assigns it by recorded
      # duration rather than Playwright's `--shard`, which slices the
      # alphabetical test list into equal counts: that put the slow c* and g*
      # specs on one shard, which then ran 19.7 minutes while the others ran
      # 6 to 8. Six file-balanced shards come out near 7 minutes each; the
      # count is mirrored in `test/e2e-shards.test.ts`.
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps: &e2e-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same selection `plan` reports, computed on this runner so the job
      # does not wait for another one.
      - name: Select affected suites
        id: select
        run: node scripts/ci-selection.mjs
      # The Chromium download is ~30 s per shard on every run; the browser
      # directory is versioned (chromium-<build>), so restoring a stale cache
      # after a Playwright bump is safe — the install step then downloads only
      # the new build.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      # Browser binaries only. The hosted Ubuntu image already carries
      # Chromium's libraries: `--with-deps` added only fonts and package
      # upgrades from the Ubuntu mirror, which crawled at ~35 kB/s on 17% of
      # shard installs (up to 12 minutes) in October 2026. A missing library
      # fails Chromium's launch outright, never a test silently.
      - run: pnpm exec playwright install chromium
      # The Playwright webServer builds and serves the app inside the job. The
      # JSON report is what `scripts/e2e-shards.mjs --update` rebalances from.
      - env:
          OPENZCAD_E2E_SUITE: ${{ steps.select.outputs.e2e }}
          CI_BASE_SHA: ${{ steps.select.outputs.base }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/e2e-report-${{ matrix.shard }}.json
        run: |
          spec_selection="$(node scripts/e2e-shards.mjs "${{ matrix.shard }}/${{ strategy.job-total }}")"
          mapfile -t specs <<< "$spec_selection"
          pnpm test:e2e --reporter=dot,json "${specs[@]}"
      - name: Upload browser failure context
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-failures-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload e2e timing report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-report-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: ${{ job.status == 'success' && 7 || 14 }}

  # PR shards run beside lint, typecheck, units and build.
  e2e-tests-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy: *e2e-strategy
    steps: *e2e-steps

  # A single stable check context for branch protection, so the required-check
  # list does not depend on the shard count or the event. Runs even when a
  # shard fails: a skipped job satisfies branch protection, so this job must
  # run and fail explicitly unless exactly one shard set ran and succeeded.
  # Exactly one selected browser set must pass, including on the combined queue tree.
  e2e-queue:
    if: ${{ !cancelled() && needs.plan.result == 'success' && github.event_name == 'merge_group' && needs.plan.outputs.e2e != 'full' }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENZCAD_E2E_SUITE: smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      # Five tagged canaries, not the full cases in these files.
      - name: Run combined-tree save and history canaries
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/e2e-queue.json
        run: pnpm test:e2e --reporter=dot,json test/e2e/save-state-history.spec.ts test/e2e/feature-history.spec.ts
      - name: Upload queue browser report and failure context
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-queue-report
          path: |
            ${{ runner.temp }}/e2e-queue.json
            test-results/
          if-no-files-found: warn
          retention-days: ${{ job.status == 'success' && 7 || 14 }}

  e2e:
    timeout-minutes: 15
    needs: [plan, e2e-tests, e2e-tests-pr, e2e-queue]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require one green shard set
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLAN_RESULT: ${{ needs.plan.result }}
          DIRECT_RESULT: ${{ needs.e2e-tests.result }}
          QUEUE_RESULT: ${{ needs.e2e-queue.result }}
          PR_RESULT: ${{ needs.e2e-tests-pr.result }}
        run: |
          echo "e2e shards ($EVENT_NAME): direct $DIRECT_RESULT, pull request $PR_RESULT"
          test "$PLAN_RESULT" = success
          case "$EVENT_NAME/$DIRECT_RESULT/$PR_RESULT/$QUEUE_RESULT" in
            */success/skipped/skipped | */skipped/success/skipped | merge_group/skipped/skipped/success) echo 'all e2e shards green' ;;
            */skipped/skipped/skipped)
              echo 'No shard ran.' >&2
              exit 1 ;;
            *) exit 1 ;;
          esac
