[package]
name = "openzcad-desktop"
version = "0.1.0"
description = "OpenZCAD desktop shell"
authors = ["OpenZCAD contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "Apache-2.0"

[lib]
name = "openzcad_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
# The embedded HTTP automation server must never ship in a release build.
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
