[package]
name = "openzcad-desktop"
version = "0.1.0"
description = "OpenZCAD desktop shell"
authors = ["OpenZCAD contributors"]
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[lib]
name = "openzcad_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
openzcad-device-keys = { path = "../device-keys" }
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream", "system-proxy"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["sync", "time"] }
# The embedded HTTP automation server must never ship in a release build.
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# GTK 0.18 cannot use GLib 0.20; keep the upstream iterator fix on every 0.18 path.
[patch.crates-io]
glib = { path = "vendor/glib" }
